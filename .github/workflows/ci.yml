name: CI

on:
  push:
    branches: [main, "codex/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  lint:
    name: Ruff lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff==0.16.9
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: API, Home Assistant and Assist regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: python -m pytest -q --timeout=30 --cov=custom_components/lists_assistant --cov-report=term-missing --cov-report=xml --cov-fail-under=90
      - name: Coverage summary
        if: always()
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: Home Assistant frontend in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements_test.txt
            requirements_e2e.txt
      - run: pip install -r requirements_e2e.txt
      - run: sudo apt-get update && sudo apt-get install -y libturbojpeg
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/e2e/ha_ui.py -q --timeout=180 --tb=short
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-e2e
          path: .test-state/e2e/
          include-hidden-files: true
          retention-days: 7
